name: Generate iCalendar feeds

on:
  push:
    branches:
      - feature/ical-feeds
    paths:
      - 'source/data/miqaats.json'
      - 'source/assets/javascripts/_lib/hijri_date.js'
      - 'bin/generate_ical.js'
      - '.github/workflows/generate-ical.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: feature/ical-feeds

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate iCalendar feeds
        run: node bin/generate_ical.js --start-year 1440 --end-year 1460

      - name: Commit generated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/calendars/*.ics
          if git diff --cached --quiet; then
            echo "No calendar changes to commit."
          else
            git commit -m "Generate Dawoodi Bohra iCalendar feeds"
            git push
          fi
